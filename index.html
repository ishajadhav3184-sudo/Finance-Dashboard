<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal Finance Dashboard</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1c2433;--muted:#6b7589;--line:#e3e8f0;--accent:#4f46e5;--green:#16a34a;--red:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#192032;--text:#e8ecf5;--muted:#93a0b8;--line:#2a3550;--accent:#818cf8;--green:#4ade80;--red:#f87171}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#192032;--text:#e8ecf5;--muted:#93a0b8;--line:#2a3550;--accent:#818cf8;--green:#4ade80;--red:#f87171}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:1.5rem;margin:0}
.tools{display:flex;gap:8px}
select,input,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button{cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}
.charts{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{font-size:1rem;margin:0 0 12px}
.label{color:var(--muted);font-size:.8rem}
.big{font-size:1.6rem;font-weight:700;margin-top:4px}
.pos{color:var(--green)}.neg{color:var(--red)}
.cv{position:relative;height:250px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.over{background:var(--red)}
.row{display:flex;justify-content:space-between;font-size:.88rem;gap:8px}
.bottom{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.list{max-height:420px;overflow-y:auto}
.tx{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:8px}
.tx small{color:var(--muted);display:block}
.tx button{padding:2px 8px;color:var(--muted)}
.amt{font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const {useState,useEffect,useRef,useMemo}=React;
const h=React.createElement;
const EXP=["Food","Rent","Transport","Shopping","Bills","Health","Fun"];
const INC=["Salary","Freelance","Other"];
const BUDGET={Food:400,Rent:1000,Transport:150,Shopping:200,Bills:180,Health:100,Fun:150};
const COLORS=["#6366f1","#22c55e","#f59e0b","#ef4444","#06b6d4","#a855f7","#ec4899"];
const KEY="fin-dash-v1";
const iso=d=>d.toISOString().slice(0,10);
const ago=(m,day)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-m);d.setDate(day);return iso(d)};

function seed(){
  const t=[];let id=1;
  for(let m=0;m<6;m++){
    t.push({id:id++,type:"income",desc:"Monthly salary",amount:3200,cat:"Salary",date:ago(m,1)});
    t.push({id:id++,type:"expense",desc:"Rent",amount:1000,cat:"Rent",date:ago(m,2)});
    t.push({id:id++,type:"expense",desc:"Groceries",amount:300+((m*37)%90),cat:"Food",date:ago(m,8)});
    t.push({id:id++,type:"expense",desc:"Fuel & transit",amount:90+((m*13)%50),cat:"Transport",date:ago(m,10)});
    t.push({id:id++,type:"expense",desc:"Utilities",amount:150+((m*7)%30),cat:"Bills",date:ago(m,12)});
    t.push({id:id++,type:"expense",desc:"Shopping",amount:80+((m*53)%160),cat:"Shopping",date:ago(m,15)});
    if(m%2===0)t.push({id:id++,type:"income",desc:"Freelance gig",amount:450,cat:"Freelance",date:ago(m,18)});
    t.push({id:id++,type:"expense",desc:"Movies & dining",amount:60+((m*29)%80),cat:"Fun",date:ago(m,20)});
  }
  return t.filter(x=>x.date<=iso(new Date()));
}
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return null}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}

function useChart(ref,config,deps){
  useEffect(()=>{
    const css=getComputedStyle(document.documentElement);
    Chart.defaults.color=css.getPropertyValue("--muted").trim()||"#888";
    Chart.defaults.borderColor=css.getPropertyValue("--line").trim()||"#ddd";
    const c=new Chart(ref.current,config());
    return()=>c.destroy();
  },deps);
}

function Doughnut({data}){
  const ref=useRef();
  useChart(ref,()=>({type:"doughnut",data:{labels:data.map(d=>d[0]),datasets:[{data:data.map(d=>d[1]),backgroundColor:COLORS,borderWidth:0}]},options:{maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"right"}}}}),[JSON.stringify(data)]);
  return h("div",{className:"cv"},h("canvas",{ref}));
}
function Bars({labels,inc,exp}){
  const ref=useRef();
  useChart(ref,()=>({type:"bar",data:{labels,datasets:[{label:"Income",data:inc,backgroundColor:"#22c55e",borderRadius:4},{label:"Expenses",data:exp,backgroundColor:"#ef4444",borderRadius:4}]},options:{maintainAspectRatio:false,scales:{y:{beginAtZero:true}}}}),[JSON.stringify([labels,inc,exp])]);
  return h("div",{className:"cv"},h("canvas",{ref}));
}
function Trend({labels,vals}){
  const ref=useRef();
  useChart(ref,()=>({type:"line",data:{labels,datasets:[{label:"Net savings",data:vals,borderColor:"#6366f1",backgroundColor:"rgba(99,102,241,.15)",fill:true,tension:.3}]},options:{maintainAspectRatio:false}}),[JSON.stringify([labels,vals])]);
  return h("div",{className:"cv"},h("canvas",{ref}));
}

function App(){
  const [tx,setTx]=useState(()=>load()||seed());
  const [cur,setCur]=useState("USD");
  const [filter,setFilter]=useState("all");
  const [f,setF]=useState({type:"expense",desc:"",amount:"",cat:"Food",date:iso(new Date())});
  useEffect(()=>save(tx),[tx]);
  const fmt=n=>new Intl.NumberFormat(undefined,{style:"currency",currency:cur,maximumFractionDigits:0}).format(n);
  const month=iso(new Date()).slice(0,7);

  const s=useMemo(()=>{
    const sum=(a)=>a.reduce((x,y)=>x+y.amount,0);
    const thisM=tx.filter(t=>t.date.startsWith(month));
    const income=sum(thisM.filter(t=>t.type==="income")),expense=sum(thisM.filter(t=>t.type==="expense"));
    const byCat=EXP.map(c=>[c,sum(thisM.filter(t=>t.type==="expense"&&t.cat===c))]).filter(x=>x[1]>0);
    const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);months.push(iso(d).slice(0,7))}
    const labels=months.map(m=>new Date(m+"-02").toLocaleString(undefined,{month:"short"}));
    const inc=months.map(m=>sum(tx.filter(t=>t.type==="income"&&t.date.startsWith(m))));
    const exp=months.map(m=>sum(tx.filter(t=>t.type==="expense"&&t.date.startsWith(m))));
    const net=inc.map((v,i)=>v-exp[i]);
    const total=sum(tx.filter(t=>t.type==="income"))-sum(tx.filter(t=>t.type==="expense"));
    return{income,expense,byCat,labels,inc,exp,net,total};
  },[tx,month]);

  const add=()=>{
    const a=parseFloat(f.amount);
    if(!f.desc.trim()||!(a>0))return;
    setTx([{id:Date.now(),type:f.type,desc:f.desc.trim(),amount:a,cat:f.cat,date:f.date},...tx]);
    setF({...f,desc:"",amount:""});
  };
  const cats=f.type==="expense"?EXP:INC;
  const shown=tx.filter(t=>filter==="all"||t.type===filter).sort((a,b)=>b.date.localeCompare(a.date));
  const rate=s.income>0?Math.round((s.income-s.expense)/s.income*100):0;

  const stat=(l,v,c)=>h("div",{className:"card"},h("div",{className:"label"},l),h("div",{className:"big "+(c||"")},v));
  const set=k=>e=>setF({...f,[k]:e.target.value,...(k==="type"?{cat:e.target.value==="expense"?EXP[0]:INC[0]}:{})});

  return h("div",{className:"wrap"},
    h("header",null,
      h("h1",null,"💰 Personal Finance Dashboard"),
      h("div",{className:"tools"},
        h("select",{value:cur,onChange:e=>setCur(e.target.value)},["USD","INR","EUR","GBP"].map(c=>h("option",{key:c},c))),
        h("button",{onClick:()=>{if(confirm("Reset to sample data?"))setTx(seed())}},"Reset"))),
    h("div",{className:"grid stats"},
      stat("Total balance",fmt(s.total),s.total>=0?"pos":"neg"),
      stat("Income (this month)",fmt(s.income),"pos"),
      stat("Expenses (this month)",fmt(s.expense),"neg"),
      stat("Savings rate",rate+"%",rate>=0?"pos":"neg")),
    h("div",{className:"grid charts"},
      h("div",{className:"card"},h("h2",null,"Spending by category"),s.byCat.length?h(Doughnut,{data:s.byCat}):h("p",{className:"label"},"No expenses this month.")),
      h("div",{className:"card"},h("h2",null,"Income vs expenses"),h(Bars,{labels:s.labels,inc:s.inc,exp:s.exp})),
      h("div",{className:"card"},h("h2",null,"Net savings trend"),h(Trend,{labels:s.labels,vals:s.net}))),
    h("div",{className:"grid bottom"},
      h("div",{className:"card"},h("h2",null,"Monthly budgets"),
        EXP.map(c=>{const spent=(s.byCat.find(x=>x[0]===c)||[0,0])[1],lim=BUDGET[c],p=Math.min(100,spent/lim*100);
          return h("div",{key:c},h("div",{className:"row"},h("span",null,c),h("span",{className:spent>lim?"neg":""},fmt(spent)+" / "+fmt(lim))),
            h("div",{className:"bar"},h("i",{className:spent>lim?"over":"",style:{width:p+"%"}})))})),
      h("div",{className:"card"},h("h2",null,"Add transaction"),
        h("div",{className:"form"},
          h("select",{value:f.type,onChange:set("type")},h("option",{value:"expense"},"Expense"),h("option",{value:"income"},"Income")),
          h("select",{value:f.cat,onChange:set("cat")},cats.map(c=>h("option",{key:c},c))),
          h("input",{placeholder:"Description",value:f.desc,onChange:set("desc")}),
          h("input",{type:"number",min:"0",placeholder:"Amount",value:f.amount,onChange:set("amount"),onKeyDown:e=>e.key==="Enter"&&add()}),
          h("input",{type:"date",value:f.date,onChange:set("date")}),
          h("button",{className:"primary",onClick:add},"Add")),
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"16px 0 4px"}},
          h("h2",{style:{margin:0}},"Transactions"),
          h("select",{value:filter,onChange:e=>setFilter(e.target.value)},h("option",{value:"all"},"All"),h("option",{value:"income"},"Income"),h("option",{value:"expense"},"Expenses"))),
        h("div",{className:"list"},shown.length?shown.map(t=>h("div",{className:"tx",key:t.id},
          h("div",null,t.desc,h("small",null,t.cat+" · "+t.date)),
          h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
            h("span",{className:"amt "+(t.type==="income"?"pos":"neg")},(t.type==="income"?"+":"-")+fmt(t.amount)),
            h("button",{title:"Delete",onClick:()=>setTx(tx.filter(x=>x.id!==t.id))},"✕")))):h("p",{className:"label"},"No transactions."))))
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
